services:
  lacy-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      LACY_DEV_HOME: /tmp/lacy-docker-home
      LACY_DEV_TOOL: custom
      LACY_DEV_CUSTOM_COMMAND: /workspace/scripts/fake-agent.sh
      LACY_SIMPLE_PROMPT: "true"
    volumes:
      - .:/workspace
    command: >
      bash -lc
      "chmod +x scripts/fake-agent.sh scripts/dev-zsh.sh scripts/smoke-agent.sh &&
      ./scripts/dev-zsh.sh"

  lacy-smoke:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      LACY_SMOKE_HOME: /tmp/lacy-smoke-home
      LACY_SIMPLE_PROMPT: "true"
    volumes:
      - .:/workspace
    command: >
      bash -lc
      "chmod +x scripts/fake-agent.sh scripts/smoke-agent.sh &&
      ./scripts/smoke-agent.sh"
